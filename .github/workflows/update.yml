name: Redirections (Pages)

# 2026-10-24: Lot Repéré merged into ao-formation (https://ao-formation.jalonel.com/secteurs/). This repository now only
# publishes the redirect pages of lot-repere.jalonel.com (redirects/, made by tools/redirects.py). No schedule: the
# tenders are fetched by VREAD-corp/veille-ao-formation.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["redirects/**", ".github/workflows/update.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update-and-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: redirects

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
